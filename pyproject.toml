[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-weather-demo"
version = "0.1.0"
description = "MCP (Model Context Protocol) demo: a server exposing current-location & weather tools, plus an agent that auto-calls them via LLM function calling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lindong4067" }]
keywords = ["mcp", "model-context-protocol", "weather", "llm", "agent"]
dependencies = [
    "mcp==2.1.1",
    "httpx==0.28.1",
    "openai==3.8.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
mcp-weather-server = "server:main"
mcp-weather-agent = "agent:main"
mcp-weather-deploy = "deploy:main"

[tool.setuptools]
py-modules = ["server", "agent", "test_client", "deploy"]
